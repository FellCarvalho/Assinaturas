<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinatura de E-mail - CTECH Responsiva</title>
  <style>
    /* Regras de suporte para navegadores de celular */
    img {
      max-width: 100%;
      height: auto;
    }
    @media only screen and (max-width: 480px) {
      .responsive-column {
        width: 100% !important;
        display: block !important;
        text-align: center !important;
        padding-right: 0 !important;
        padding-left: 0 !important;
      }
      .responsive-hide-divider {
        display: none !important;
      }
      .responsive-align-left {
        text-align: left !important;
      }
      .social-align {
        float: none !important;
        margin-top: 15px !important;
        text-align: center !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #ffffff;">

  <!-- Tabela Container Flexível -->
  <table cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 650px; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #ffffff; margin: 0 auto;">
    <tr>
      <td style="padding: 15px 10px;">
        
        <!-- BLOCOS PRINCIPAIS (ALINHAMENTO inline-block PARA EMPILHAR EM TELAS PEQUENAS) -->
        <table cellpadding="0" cellspacing="0" border="0" width="100%">
          <tr>
            <td style="font-size: 0; text-align: left;">
              
              <!-- 1. BLOCO LOGO -->
              <!--[if (gte mso 9)|(IE)]>
              <table width="160" align="left" cellpadding="0" cellspacing="0" border="0"><tr><td>
              <![endif]-->
              <div class="responsive-column" style="width: 100%; max-width: 160px; display: inline-block; vertical-align: middle; text-align: center; padding-bottom: 10px;">
                <img src="https://github.com/FellCarvalho/Assinaturas/blob/b199c95b967f2b727255a71fa2fccd0b0bb2827d/logo/ctech_logo_mark.png" alt="CTECH" style="width: 100%; max-width: 140px; height: auto; display: block; border: 0; margin: 0 auto;">
              </div>
              <!--[if (gte mso 9)|(IE)]>
              </td><td>
              <![endif]-->

              <!-- 2. DIVISOR VERTICAL (Invisível em celulares) -->
              <div class="responsive-hide-divider" style="display: inline-block; vertical-align: middle; width: 15px; text-align: center;">
                <table cellpadding="0" cellspacing="0" border="0" height="100" style="height: 100px; margin: 0 auto;">
                  <tr><td width="1" style="background-color: #f39200; height: 40px; font-size: 1px;">&nbsp;</td></tr>
                  <tr><td align="center" style="padding: 3px 0;"><div style="width: 5px; height: 5px; background-color: #333333; border-radius: 50%;"></div></td></tr>
                  <tr><td width="1" style="background-color: #f39200; height: 40px; font-size: 1px;">&nbsp;</td></tr>
                </table>
              </div>
              <!--[if (gte mso 9)|(IE)]>
              </td><td>
              <![endif]-->

              <!-- 3. BLOCO INFORMAÇÕES DE CONTATO E REDES -->
              <div class="responsive-column" style="width: 100%; max-width: 440px; display: inline-block; vertical-align: middle; padding-left: 10px; box-sizing: border-box;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td>
                      <!-- Nome -->
                      <div style="font-size: 22px; font-weight: bold; color: #222222; margin-bottom: 2px; font-family: 'Segoe UI', Arial, sans-serif;">
                        Felipe Carvalho
                      </div>
                      
                      <!-- Cargo -->
                      <div style="font-size: 13px; color: #555555; margin-bottom: 10px;">
                        Supervisor de Atendimento <span style="color: #cccccc;">|</span> Equipe <span style="color: #f39200; font-weight: bold;">CTECH.</span>
                      </div>

                      <!-- Tabela de Ícones + Texto (Telefone, E-mail, Site) e Redes Sociais -->
                      <table cellpadding="0" cellspacing="0" border="0" width="100%">
                        <tr>
                          <!-- Contatos Lado Esquerdo -->
                          <td valign="top">
                            <table cellpadding="0" cellspacing="0" border="0">
                              <tr>
                                <td width="20" valign="middle" style="padding-bottom: 5px;">
                                  <img src="https://github.com/FellCarvalho/Assinaturas/blob/b199c95b967f2b727255a71fa2fccd0b0bb2827d/logo/ctech_wordmark_orange.png" alt="Tel" width="15" style="display: block; max-width: 100%; height: auto;">
                                </td>
                                <td valign="middle" style="padding-bottom: 5px; font-size: 12px; color: #333333;">
                                  (11) 99999-9999
                                </td>
                              </tr>
                              <tr>
                                <td width="20" valign="middle" style="padding-bottom: 5px;">
                                  <img src="https://SEU-USUARIO.github.io/assinatura-email/images/icon-email.png" alt="Email" width="15" style="display: block; max-width: 100%; height: auto;">
                                </td>
                                <td valign="middle" style="padding-bottom: 5px; font-size: 12px;">
                                  <a href="mailto:felipe@ctech.com.br" style="color: #333333; text-decoration: none;">felipe@ctech.com.br</a>
                                </td>
                              </tr>
                              <tr>
                                <td width="20" valign="middle">
                                  <img src="https://SEU-USUARIO.github.io/assinatura-email/images/icon-web.png" alt="Web" width="15" style="display: block; max-width: 100%; height: auto;">
                                </td>
                                <td valign="middle" style="font-size: 12px;">
                                  <a href="https://www.ctech.com.br" target="_blank" style="color: #333333; text-decoration: none;">www.ctech.com.br</a>
                                </td>
                              </tr>
                            </table>
                          </td>

                          <!-- Redes Sociais Lado Direito -->
                          <td valign="bottom" align="right" class="social-align">
                            <table cellpadding="0" cellspacing="0" border="0" style="display: inline-block;">
                              <tr>
                                <td style="padding-right: 8px; font-size: 14px; color: #f39200; font-weight: bold;">|</td>
                                <td style="padding-right: 5px;">
                                  <a href="https://linkedin.com" target="_blank">
                                    <img src="https://SEU-USUARIO.github.io/assinatura-email/images/icon-linkedin.png" alt="LinkedIn" width="18" style="display: block; max-width: 100%; height: auto;">
                                  </a>
                                </td>
                                <td style="padding-right: 5px;">
                                  <a href="https://youtube.com" target="_blank">
                                    <img src="https://SEU-USUARIO.github.io/assinatura-email/images/icon-youtube.png" alt="YouTube" width="18" style="display: block; max-width: 100%; height: auto;">
                                  </a>
                                </td>
                                <td>
                                  <a href="https://instagram.com" target="_blank">
                                    <img src="https://SEU-USUARIO.github.io/assinatura-email/images/icon-instagram.png" alt="Instagram" width="18" style="display: block; max-width: 100%; height: auto;">
                                  </a>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>

                    </td>
                  </tr>
                </table>
              </div>
              <!--[if (gte mso 9)|(IE)]>
              </td></tr></table>
              <![endif]-->

            </td>
          </tr>
        </table>

        <!-- LINHA DIVISÓRIA INFERIOR -->
        <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-top: 15px; margin-bottom: 10px;">
          <tr>
            <td width="35%" style="border-bottom: 1px solid #e0e0e0; font-size: 1px;">&nbsp;</td>
            <td width="30%" style="border-bottom: 3px solid #f39200; font-size: 1px;">&nbsp;</td>
            <td width="35%" style="border-bottom: 1px solid #e0e0e0; font-size: 1px;">&nbsp;</td>
          </tr>
        </table>

        <!-- AVISO DE ISENÇÃO (DISCLAIMER) -->
        <table cellpadding="0" cellspacing="0" border="0" width="100%">
          <tr>
            <td width="20" valign="middle" style="padding-right: 6px;">
              <img src="https://SEU-USUARIO.github.io/assinatura-email/images/icon-shield.png" alt="Aviso" width="14" style="display: block; max-width: 100%; height: auto;">
            </td>
            <td valign="middle" style="font-size: 10px; color: #777777; line-height: 1.3;">
              A CTECH não se responsabiliza por erros, falhas ou incompatibilidades de softwares, equipamentos ou componentes comprados com terceiros.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
